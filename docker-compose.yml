version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: framevalue-db
    environment:
      POSTGRES_DB: framevalue_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - framevalue-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: framevalue-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/framevalue_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - framevalue-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  framevalue-network:
    driver: bridge